[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-harm-heuristics"
version = "1.0.0"
description = "Can we estimate privacy harm with interpretable heuristics, given facts parsed by a small LLM? Companion artifact to the masters practicum 'Human vs Human vs Machine' (Dec 2025)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Will" }]
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.3",
    "typer>=0.12",
    "pydantic>=2",
]

[project.optional-dependencies]
# interpret -> EBM; imodels -> Bayesian Rule List; pomegranate -> Bayesian Network.
# The BRL/bayes_net trainer *tests* importorskip on imodels/pomegranate, so `make
# test` degrades cleanly if this extra is absent.
models = ["interpret>=0.6", "imodels>=1.4", "pomegranate>=1.0"]
llm = ["openai>=1.30", "google-generativeai>=0.8"]
nlp = ["gliner2>=0.1"]
dev = [
    "pytest>=8",
    "ruff>=0.4,<0.17",
    "black>=24,<27",
    "mypy>=1.10,<3",
]

[project.scripts]
privacy-harm-heuristics = "privacy_harm_heuristics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
# State the rule set explicitly rather than inheriting ruff's default. This is
# the set ruff <=0.15 selected by default; 0.16 widened its default by ~30 rule
# families (notably PYI, B, SIM, C, UP, RUF, PL, S), which turned a clean tree
# into a wall of findings without a line of project code changing. Enforcement
# should move when we decide it moves, not when a dependency resolves to a new
# release. Same rule selection as agentic-privacy; that repo also bounds pytest
# and pre-commit, which this one does not.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow model-training tests"]
